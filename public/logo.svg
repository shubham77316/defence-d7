  </g>

  <!-- Dynamic Cyan Blue 'S' Swash -->
  <path
    d="M 74 18 C 48 16, 32 30, 36 41 C 40 52, 60 51, 69 60 C 76 67, 70 78, 52 81 C 38 83, 27 82, 25 82 C 35 81, 46 78, 49 73 C 53 67, 44 61, 35 55 C 24 48, 26 34, 43 25 C 56 18, 68 18, 74 18 Z"
    fill="url(#anuvyomExactBlue)"
  />

  <defs>
    <linearGradient id="anuvyomExactBlue" x1="74" y1="18" x2="25" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" />
      <stop offset="0.5" stop-color="#00E5FF" />
      <stop offset="1" stop-color="#0284C7" />
    </linearGradient>
  </defs>
</svg>
