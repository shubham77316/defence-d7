<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White Glyphs Layer -->
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Serif of A -->
    <path d="M 16 65 C 19 68, 23 68, 27 63" stroke-width="3" />
    
    <!-- Left Ascending Leg of A -->
    <path d="M 27 63 L 53 14" stroke-width="4.5" />
    
    <!-- Right Descending Leg of A -->
    <path d="M 53 14 L 43 65" stroke-width="4.5" />
    
    <!-- Crossbar of A -->
    <path d="M 33 48 L 52 48" stroke-width="3" />
    
    <!-- Lower Serif of A's right leg -->
    <path d="M 40 65 L 46 65" stroke-width="3" />

    <!-- Right Arch Ligature (H / M) -->
    <path
      d="M 50 42 C 57 32, 70 30, 72 38 C 74 46, 68 62, 66 70"
      stroke-width="4"
      fill="none"
    />

    <!-- Detached Lower Right Angled Stem -->
