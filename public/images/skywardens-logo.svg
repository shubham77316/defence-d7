<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" fill="none">
  <!-- Tactical Shield Outline -->
  <path
    d="M 160 18 L 86 36 L 86 112 C 86 160 160 196 160 196 C 160 196 234 160 234 112 L 234 36 Z"
    stroke="#0e3d6e"
    stroke-width="12"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Three Contrail Speed Streaks -->
  <path d="M 100 156 L 68 190" stroke="#0e3d6e" stroke-width="5" stroke-linecap="round" />
  <path d="M 110 164 L 78 200" stroke="#0e3d6e" stroke-width="5.5" stroke-linecap="round" />
  <path d="M 120 172 L 92 204" stroke="#0e3d6e" stroke-width="5" stroke-linecap="round" />

  <!-- Supersonic Delta Jet Fighter Body -->
  <g id="fighter-jet">
    <!-- Main Wings & Fuselage Base Silhouette -->
    <path
      d="M 238 24 L 208 64 L 194 62 L 194 76 L 98 84 L 126 122 L 106 148 L 134 136 L 144 148 L 166 120 L 178 156 L 188 88 L 204 76 Z"
      fill="#124b80"
    />

    <!-- Left Wing & Chined Body Highlight -->
    <path
      d="M 238 24 L 194 62 L 106 148 L 134 136 L 144 148 L 166 120 L 204 76 Z"
      fill="#1a5b98"
    />

    <!-- Forward Fuselage Ridge -->
    <path
      d="M 238 24 L 194 62 L 144 148 L 166 120 L 204 76 Z"
      fill="#104373"
    />

    <!-- White Cockpit Canopy -->
    <path
      d="M 218 36 C 210 44 200 56 198 58 C 204 52 214 40 218 36 Z"
      fill="#ffffff"
    />
    <ellipse
      cx="208"
      cy="47"
      rx="10"
      ry="4.5"
      transform="rotate(-48 208 47)"
      fill="#ffffff"
    />

    <!-- Wing Hardpoint Dots -->
    <circle cx="118" cy="98" r="4.5" fill="#ffffff" />
    <circle cx="118" cy="98" r="2" fill="#0e3d6e" />

    <circle cx="158" cy="138" r="4.5" fill="#ffffff" />
    <circle cx="158" cy="138" r="2" fill="#0e3d6e" />
  </g>
</svg>
